# ContractIQ - CI/CD Pipeline
# Automated API Testing, Contract Validation, and Reporting

name: ContractIQ CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Target API URL'
        required: false
        default: 'http://localhost:8000'

env:
  PYTHON_VERSION: '3.11'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  # Job 1: Lint and Validate Spec
  validate:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate OpenAPI Specification
        run: python main.py validate --spec configs/openapi_spec.yaml

  # Job 2: Generate Tests and Run Unit Tests
  test:
    name: Generate & Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html \
            --cov-report=json:output/coverage.json \
            --junitxml=output/junit_report.xml \
            --html=output/test_report.html \
            -x

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            output/junit_report.xml
            output/test_report.html
            output/coverage.json
            htmlcov/

  # Job 3: AI Test Generation
  generate:
    name: AI Test Generation
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate AI Test Cases
        run: python main.py generate --spec configs/openapi_spec.yaml

      - name: Upload Generated Tests
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: |
            output/postman_collection.json
            output/pipeline_result.json

  # Job 4: Integration Testing
  integration:
    name: Integration & E2E Tests
    needs: [test, generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js (for Newman + Dredd)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g newman newman-reporter-htmlextra dredd

      - name: Download Generated Tests
        uses: actions/download-artifact@v4
        with:
          name: generated-tests
          path: output/

      - name: Start Target API
        run: |
          python -m uvicorn api.petstore_api:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -f http://localhost:8000/health || exit 1

      - name: Execute Tests Against API
        run: python main.py execute --base-url http://localhost:8000

      - name: Run Contract Validation (Schemathesis + Dredd)
        # Runs both validators through main.py's CLI wrapper, which
        # auto-patches the spec for Dredd (OpenAPI 3.1 -> 3.0 + parameter
        # examples) and seeds real resource IDs via qa/dredd_hooks.js —
        # calling `dredd` directly against the raw spec fails, see
        # docs/AUDIT_AND_FIXES.md.
        run: python main.py contract --base-url http://localhost:8000 --spec configs/openapi_spec.yaml

      - name: Run Postman Collection via Newman
        run: |
          npx newman run output/postman_collection.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export output/newman/newman_report.html || true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            output/execution_results.json
            output/failure_analysis.json
            output/contract_validation.json
            output/allure-results/
            output/newman/

  # Job 5: Build Reporting Dashboard
  dashboard:
    name: Build Dashboard
    needs: [test, integration]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: output/

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: output/

      - name: Download generated tests
        uses: actions/download-artifact@v4
        with:
          name: generated-tests
          path: output/

      - name: Build dashboard
        # No Java/Allure required — see the "A note on Allure" section
        # in README.md for why this is the primary reporting UI.
        run: python main.py dashboard

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: output/dashboard.html

  # Job 6: Report Generation
  report:
    name: Generate Reports
    needs: dashboard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate Summary Report
        run: |
          echo "# ContractIQ Test Report" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard and all reports are attached as workflow artifacts (see 'dashboard', 'coverage-report', 'test-results')." >> $GITHUB_STEP_SUMMARY

      - name: Upload Final Reports
        uses: actions/upload-artifact@v4
        with:
          name: contractiq-reports
          path: artifacts/
          retention-days: 30
